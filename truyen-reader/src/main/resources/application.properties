# Cổng chạy web (hỗ trợ biến môi trường PORT khi deploy lên Render/Railway)
server.port=${PORT:8080}

# Tự động nạp profile local nếu có (application-local.properties)
spring.profiles.include=local

# Kết nối Cơ sở dữ liệu Cloud Supabase qua biến môi trường
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.aktpjeyoosjyzdqcexsv}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# update = Giữ nguyên dữ liệu trên Supabase khi restart
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Tối ưu kết nối pool Hikari
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
